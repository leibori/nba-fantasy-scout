spring:
  application:
    name: nba-fantasy-scout
  datasource:
    url: jdbc:postgresql://localhost:5432/scout
    username: scout
    password: scout
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    cache-names: forms
    caffeine:
      spec: maximumSize=1,expireAfterWrite=25h   # one list of all players; 25h = safety net if a daily sync is missed

scout:
  espn:
    teams-base-url: https://site.api.espn.com/apis/site/v2/sports/basketball/nba
    game-log-base-url: https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba
    timeout: 10s
  sleeper:
    base-url: https://api.sleeper.app/v1
    timeout: 30s               # the player list is ~2.5 MB
    lookback-hours: 24
    limit: 25
  sync:
    season: 2027               # year the season ends (2027 = 2026-27)
    max-consecutive-failures: 10
  matcher:
    min-confidence: 0.85       # below this a name match is "unsure"
  trend:
    window: 3                  # recent games compared with the baseline
    min-baseline-games: 5      # fewer earlier games this season -> last season is the (provisional) baseline
    min-minutes: 15            # per game, in the recent or the baseline period
    hot-threshold: 0.15        # hot score above +0.15 = hot, below -0.15 = cold
    high-value: 1.0            # value (sum of 9-cat z-scores) that counts as "good right now"; about a top-100 player
    early-cold-min-minutes: 18 # early in a season, only a player with this many baseline minutes can be cold
    early-cold-min-minutes-drop: 0.15 # ... and only when his minutes fell at least 15% (fewer shots alone is noise)
    league-min-minutes: 15     # players averaging fewer minutes are left out of the value league
    percentage-weight: 0.5     # FG% / FT% share of the value; low because shooting is noisy in small samples
  hot-streak:
    minutes-weight: 0.4
    field-goals-attempted-weight: 0.3
    opportunity-weight: 0.3

logging:
  file:
    name: logs/scout.log
  logback:
    rollingpolicy:
      max-history: 2         # days of rotated files to keep
      total-size-cap: 50MB   # hard cap on the whole logs folder
