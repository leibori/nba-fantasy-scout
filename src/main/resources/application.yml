server:
  port: ${PORT:8080}           # hosting platforms pass the port in PORT

spring:
  application:
    name: nba-fantasy-scout
  datasource:
    url: jdbc:postgresql://localhost:5432/scout
    username: scout
    password: scout
    hikari:
      minimum-idle: 0          # close idle connections, so a scale-to-zero database (Neon) can sleep;
      idle-timeout: 60000      # the trend cache means the database is only touched about once a day
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    cache-names: season
    caffeine:
      spec: maximumSize=1,expireAfterWrite=25h   # one season snapshot of all players; 25h = safety net if a daily sync is missed

scout:
  espn:
    teams-base-url: https://site.api.espn.com/apis/site/v2/sports/basketball/nba
    game-log-base-url: https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba
    timeout: 10s
    max-calls-per-second: 20   # shared by all sync threads
  sleeper:
    base-url: https://api.sleeper.app/v1
    timeout: 30s               # the player list is ~2.5 MB
    max-calls-per-second: 5
    lookback-hours: 24
    limit: 25
  yahoo:
    base-url: https://pub-api-ro.fantasysports.yahoo.com/fantasy/v2  # read-only, public leagues, no login
    timeout: 10s
    max-calls-per-second: 2    # an undocumented host: stay gentle
    max-free-agents: 150       # 6 requests; weaker free agents are never suggested anyway
  http:
    max-attempts: 3            # first call + 2 retries, on network errors, 429 and 5xx
    initial-backoff: 500ms     # then 1s
  sync:
    threads: 8                 # parallel game log fetches; stays under Hikari's default pool of 10 connections
    max-consecutive-failures: 10
    cron: "0 0 10 * * *"       # every day at 10:00: the last US games end about 08:00 Israel time
    zone: Asia/Jerusalem
    token: ""                  # from SCOUT_SYNC_TOKEN; POST /sync/daily needs it in X-Sync-Token, empty = refused
  matcher:
    min-confidence: 0.85       # below this a name match is "unsure"
  trend:
    window: 3                  # recent games compared with the baseline
    min-baseline-games: 5      # fewer earlier games this season -> last season is the (provisional) baseline
    min-minutes: 15            # per game, in the recent or the baseline period
    hot-threshold: 0.15        # hot score above +0.15 = hot, below -0.15 = cold
    early-cold-min-minutes: 18 # early in a season, only a player with this many baseline minutes can be cold
    early-cold-min-minutes-drop: 0.15 # ... and only when his minutes fell at least 15% (fewer shots alone is noise)
    league-min-minutes: 15     # players averaging fewer minutes are left out of the value league
    percentage-weight: 0.5     # FG% / FT% share of the value; low because shooting is noisy in small samples
    inactive-after-missed-games: 3 # missed his team's last 3 games = inactive: old form no longer counts
  hot-streak:
    minutes-weight: 0.4
    field-goals-attempted-weight: 0.3
    opportunity-weight: 0.3
  scoring:
    format: points             # league format when no league is given: points | categories (?scoring= overrides it)
    point-values:              # points per stat in a points league (a typical Yahoo one)
      PTS: 1
      REB: 1.2
      AST: 1.5
      STL: 3
      BLK: 3
      TO: -1
    high-value:                # value that counts as "good right now", about a top-100 player; scales differ by format
      categories: 1.0          # sum of 9 z-scores; 100th player 1.14 (Nov 2026)
      points: 0.3              # one z-score of fantasy points per game; 100th player 0.32 (Nov 2026)
    drop-gap:                  # value a free agent must add before dropping a player for him: ~40 ranks mid-table
      categories: 1.5          # (no standard number exists; smaller differences are noise)
      points: 0.5
  roster:
    pick-up-now: 10            # free agents suggested by the roster advice
    streams: 6                 # free agents suggested for this week, by value x games left
    by-category: 10            # best free agents listed per category (FG%, REB, BLK...)
  limits:
    roster-per-minute: 10      # roster checks per visitor per minute; a Yahoo league check makes ~9 Yahoo calls
  keep-awake:
    # the site's own public address, opened every 10 minutes so a free host never puts it to sleep; Render sets
    # RENDER_EXTERNAL_URL by itself, so this is on there and off locally and in the tests
    url: ${SCOUT_KEEP_AWAKE_URL:${RENDER_EXTERNAL_URL:}}

logging:
  pattern:
    correlation: "%correlationId{correlationId(13)}" # the sync's id on every line, on every thread
  file:
    name: logs/scout.log
  logback:
    rollingpolicy:
      max-history: 2         # days of rotated files to keep
      total-size-cap: 50MB   # hard cap on the whole logs folder

---
# the demo runs its own sync; a scheduled one must not start next to it
spring:
  config:
    activate:
      on-profile: demo
scout:
  sync:
    cron: "-"
